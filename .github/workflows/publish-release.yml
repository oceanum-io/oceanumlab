name: Publish Release

# Publishes @oceanum/oceanumlab to npm and oceanumlab to PyPI when a version
# tag is pushed. The tag must be "v" plus the version in package.json (e.g.
# v4.1.0). Both registries authenticate with OIDC trusted publishing, so no
# registry secrets are needed.
on:
  push:
    tags: ["v[0-9]*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # npm and PyPI trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Check tag matches package.json version
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match package.json version '$version' (expected 'v$version')" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install -U "jupyterlab>=4.0.0,<5" build
          # npm trusted publishing needs npm >= 11.5.1
          npm install -g npm@latest

      - name: Build
        run: |
          set -eux
          jlpm
          jlpm build:prod
          python -m build

      - name: Publish to npm
        run: npm publish

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
